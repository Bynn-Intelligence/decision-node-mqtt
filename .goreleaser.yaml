version: 2

project_name: decision-node-mqtt

# A release builds go.mod and go.sum exactly as committed; CI fails when
# they are not tidy.

builds:
  - id: decision-node-mqtt
    main: ./cmd/decision-node-mqtt
    binary: decision-node-mqtt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: 'decision-node-mqtt_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

# Snapshots only for now: nothing is released or published from here.
release:
  disable: true

changelog:
  disable: true
