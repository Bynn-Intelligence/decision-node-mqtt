version: 2

project_name: decision-node-mqtt

# A release builds go.mod and go.sum exactly as committed; CI fails when
# they are not tidy.

builds:
  - id: decision-node-mqtt
    main: ./cmd/decision-node-mqtt
    binary: decision-node-mqtt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: 'decision-node-mqtt_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

# Keyless signatures of the checksums file. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/Bynn-Intelligence/decision-node-mqtt/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

# The release notes are the version's section of CHANGELOG.md, passed with
# --release-notes by the release workflow. Commit subjects are never listed:
# this filter matches none, so a run without that file gets empty notes.
changelog:
  filters:
    include:
      - '$^.'

release:
  github:
    owner: Bynn-Intelligence
    name: decision-node-mqtt
  draft: false
  prerelease: auto
