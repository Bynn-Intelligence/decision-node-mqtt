name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # go.mod and go.sum must already be tidy; nothing tidies them at release.
      - run: go mod tidy -diff
      - run: go vet ./...
      # The unit tests, and the end-to-end test against an embedded MQTT 5
      # broker and a mock DecisionNode API.
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  # Every binary GoReleaser would ship, built as an unsigned snapshot and
  # published nowhere.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=sign
      - name: Check the archives
        shell: bash
        run: |
          ls -1 dist/*.tar.gz dist/*.zip
          n="$(ls -1 dist/*.tar.gz dist/*.zip | wc -l)"
          # linux amd64, arm64, armv6, armv7; darwin amd64, arm64; windows amd64, arm64
          if [ "$n" -ne 8 ]; then
            echo "::error::$n archives, expected 8"
            exit 1
          fi
          for a in dist/*_linux_armv6.tar.gz dist/*_linux_armv7.tar.gz; do
            tar -tzf "$a" | grep -qx decision-node-mqtt || { echo "::error::$a has no binary"; exit 1; }
          done

  # The container image for linux/amd64, linux/arm64 and linux/arm/v7,
  # built and not pushed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No provenance, build record or build summary (decided 2026-10-14): with
      # them the action records the GitHub event that started the run, and a
      # push event names the pusher's email address, in the image's public
      # attestation and in the run's log. The image is signed with cosign.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          provenance: false
          build-args: VERSION=ci-${{ github.sha }}
